# Reverse proxy de la API. Único dueño del puerto del host.
# Escalar la API: docker compose up --scale api=N.
# nginx re-resuelve el nombre "api" cada 10s contra el DNS interno de Docker,
# así que las réplicas nuevas entran al balanceo solas.
server {
    listen 80;
    server_name _;

    # La API limita el body JSON a 100kb; dejamos margen holgado
    client_max_body_size 1m;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://api:5000;

        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
