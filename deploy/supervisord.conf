[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# API en el puerto interno fijo 5000 (nginx hace proxy a él).
# El PORT público de Railway lo usa nginx, no la API.
[program:api]
command=node index.js
directory=/app/dist
environment=PORT="5000",HOST="0.0.0.0"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
