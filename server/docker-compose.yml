services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    # Sin container_name para poder escalar: docker compose up --scale api=N
    # La API no publica puerto al host: nginx es el dueño del puerto y balancea.
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      # Puerto interno fijo; nginx hace proxy_pass a api:5000
      - PORT=5000
      # 0.0.0.0 para que el contenedor sea alcanzable dentro de la red de compose
      - HOST=0.0.0.0
      # Detrás de nginx: confiar en X-Forwarded-For para req.ip y rate limiters
      - TRUST_PROXY=true
      # Dentro de la red de compose, MongoDB se llama "mongo"
      - MONGO_DB_URI_DEVELOPMENT=mongodb://mongo:27017/mern_template_dev
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Reverse proxy: único dueño del puerto del host. Balancea entre réplicas de la API.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  mongo:
    image: mongo:7
    # Sin publicar puerto al host: si ya hay un MongoDB local en 27017 no hay conflicto
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
